name: CI (reprobuild)

# Additive side-by-side CI run that re-plays the project's
# deterministic dev env through reprobuild instead of `nix develop` or
# `env.ps1`. Runs alongside the existing `ci.yml` (`nix`) and any
# `windows-build.yml` (`windows-diy`) entries so regressions in either
# of the older paths still gate merges — see
# `codetracer-specs/Repo-Requirements.md` §2.9 and
# `metacraft-dev-guidelines/policies/ci-shared-dev-env.md` §4 for the
# rollout shape.
#
# The `setup-dev-env` composite action accepts `env-flavor: reprobuild`
# (target state per the policy). When the action's reprobuild branch
# lands, this workflow exercises it end-to-end on every supported
# host without any other repo-side change.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  reprobuild:
    name: ${{ matrix.os }}-${{ matrix.arch }} — repro build/test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: [self-hosted, linux, x64]
          - os: linux
            arch: arm64
            runner: [self-hosted, linux, arm64]
          - os: macos
            arch: arm64
            runner: [self-hosted, macos, arm64]
          - os: windows
            arch: x64
            runner: [self-hosted, windows, x64]
          - os: windows
            arch: arm64
            runner: [self-hosted, windows, arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Capture actual initialized checkout Git templates
        if: matrix.os == 'linux'
        shell: bash
        run: bash ci/capture-checkout-git-templates.sh "$RUNNER_TEMP/adapters-checkout-git-templates"

      # Mint a GitHub App installation token via the CI Token Provider
      # app so the reprobuild flake/sibling steps can clone private
      # metacraft-labs repos (codetracer-native-recorder, runquota,
      # repo-workspaces, etc.).  GitHub free plan restricts org-level
      # secrets with visibility ALL from being readable in private repos,
      # so we mint per-run tokens from the app secrets stored at repo
      # level (CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY).
      # Minted before the sibling clones so the workspace-lock manifest
      # checkout (private metacraft-manifests) can authenticate.
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env (reprobuild flavor)
        # setup-dev-env clones the siblings listed in .github/sibling-repos
        # (reprobuild, providing the actual ct_test_interface source leaf) at the
        # workspace-lock-pinned revisions before materialising the env.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: reprobuild
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Verify the inherited job Git authentication scope
        if: matrix.os == 'linux'
        shell: bash
        run: |
          count="${GIT_CONFIG_COUNT:-0}"
          [[ "$count" =~ ^(0|[1-9][0-9]*)$ ]] || { echo "Malformed inherited Git configuration count" >&2; exit 1; }
          test "$count" -le 256 || { echo "Oversized inherited Git configuration count" >&2; exit 1; }
          for ((i=0; i<count; i++)); do
            key_name="GIT_CONFIG_KEY_$i"
            key="${!key_name-}"
            case "$key" in
              http.https://github.com/metacraft-labs/.extraHeader|http.https://github.com/metacraft-labs/.extraheader)
                printf 'Known job authentication key: %s\n' "$key" ;;
              *) echo 'Unrelated or unknown inherited Git configuration: refusing replacement' >&2; exit 1 ;;
            esac
          done
          printf 'Qualified inherited Git authentication key count: %s\n' "$count"

      - name: Refresh job-scoped authentication for the owning Nix package
        if: matrix.os == 'linux'
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@dev
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Bind owning locked Linux Repro package
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$(git -C ../reprobuild rev-parse HEAD)" = 76659f5730ecf698b1963c656494d2cb66eb256d
          test -z "$(git -C ../reprobuild status --porcelain --untracked-files=no)"
          own_sha="$(git rev-parse HEAD)"
          test "$own_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          own_root="$(git rev-parse --show-toplevel)"
          receipt_python_out="$(nix build --no-link --print-out-paths --no-update-lock-file "git+file://$own_root?rev=$own_sha&shallow=1#ci-receipt-python")"
          test -x "$receipt_python_out/bin/python3"
          receipt_python="$receipt_python_out/bin/python3"
          package_json="$RUNNER_TEMP/adapters-own-repro-package.json"
          repro_source="$(realpath ../reprobuild)"
          nix build --no-link --json --no-update-lock-file "git+file://$repro_source?rev=76659f5730ecf698b1963c656494d2cb66eb256d&shallow=1#reprobuild" > "$package_json"
          package="$("$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert len(x)==1; print(x[0]["outputs"]["out"])' "$package_json")"
          receipt="$RUNNER_TEMP/adapters-repro-runtime-receipt"
          mkdir "$receipt"
          printf '%s\n' "$receipt_python_out" > "$receipt/python-output.txt"
          nix path-info --derivation "$receipt_python_out" > "$receipt/python-derivation.txt"
          sha256sum "$receipt_python" > "$receipt/python-executable.sha256"
          "$receipt_python" --version > "$receipt/python-version.txt"
          "$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert len(x)==1; print(json.dumps({"drvPath":x[0]["drvPath"],"outputs":x[0]["outputs"]},indent=2))' "$package_json" > "$receipt/package.json"
          test -x "$package/bin/repro"
          test -x "$package/bin/.repro-wrapped"
          test -x "$package/libexec/reprobuild-nix-daemon"
          printf 'REPROBUILD_REPRO=%s/bin/repro\n' "$package" >> "$GITHUB_ENV"
          printf 'REPROBUILD_NIX_DAEMON_BIN=%s/libexec/reprobuild-nix-daemon\n' "$package" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$package" >> "$GITHUB_PATH"
          nix flake metadata --json --no-update-lock-file "git+file://$repro_source?rev=76659f5730ecf698b1963c656494d2cb66eb256d&shallow=1" > "$RUNNER_TEMP/adapters-own-repro-source.json"
          "$receipt_python" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x["locked"]["rev"]=="76659f5730ecf698b1963c656494d2cb66eb256d"; print(json.dumps({"locked":x["locked"],"path":x["path"]},indent=2))' "$RUNNER_TEMP/adapters-own-repro-source.json" > "$receipt/source.json"
          source_root="$("$receipt_python" -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "$RUNNER_TEMP/adapters-own-repro-source.json")"
          git -C ../reprobuild rev-parse HEAD
          sha256sum "$source_root/flake.nix" "$source_root/flake.lock" "$package/bin/repro" "$package/bin/.repro-wrapped" "$package/libexec/reprobuild-nix-daemon" | tee "$receipt/identities.sha256"

      - name: Retain Linux runtime source and package identities
        if: always() && matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: adapters-repro-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/adapters-repro-runtime-receipt/
          if-no-files-found: warn
          retention-days: 7

      - name: repro build
        # Compiles both real test binaries through the existing test-builds
        # collection; the package has no executable shipping target.
        if: matrix.os != 'linux'
        run: dev-exec repro build test-builds

      - name: repro build (owning locked Linux runtime)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          "$REPROBUILD_REPRO" build test-builds --daemon=off --tool-provisioning=path

      - name: repro test
        # Materialises the `test` collection.
        if: matrix.os != 'linux'
        run: dev-exec repro test

      - name: repro test (owning locked Linux runtime)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          "$REPROBUILD_REPRO" test --daemon=off --tool-provisioning=path

      - name: Compile the complete native corpus (cross-check)
        # Compiles both shipped modules directly inside the same environment
        # to retain the native-versus-Repro parity boundary.
        run: |
          dev-exec nim c --path:src tests/test_runner_test.nim
          dev-exec nim c --path:src tests/generic_test_observations_test.nim

      - name: Run the complete native corpus (cross-check)
        run: |
          dev-exec nim c -r --path:src tests/test_runner_test.nim
          dev-exec nim c -r --path:src tests/generic_test_observations_test.nim

      # Diagnostics on failure. Three things below are load-bearing:
      #
      # 1. `include-hidden-files: true`. actions/upload-artifact@v4 defaults this
      #    input to false, and @actions/glob then skips any entry it traverses whose
      #    own basename starts with "." (internal-globber.ts:
      #    `if (options.excludeHiddenFiles && path.basename(item.path).match(/^\./))
      #    continue`). The old `path: .repro/` made `.repro` itself the search root,
      #    so it was skipped outright and this step logged
      #      "No files were found with the provided path: target/ .repro/"
      #    which `if-no-files-found: ignore` then swallowed. Net effect: the build
      #    engine's per-action stdio captures -- `<outDir>/build-engine-cache/
      #    actions/<actionId>.stderr.log`, see repro_build_engine.nim -- have never
      #    been uploaded from any leg of this workflow, on any platform.
      # 2. Narrow paths. A whole `.repro/` tree measures ~1.1 GiB (dominated by
      #    build-engine-cache/monitor-depfiles and dependency-evidence); the failure
      #    report plus the per-action logs are ~600 KiB. `target/` was dropped: it is
      #    a build-output tree rather than a log tree, it matches nothing in the Nim
      #    repos, and where it does match it would permanently mask the warning below.
      # 3. `if-no-files-found: warn` (the action's own default). This step only runs
      #    on failure, so a warning costs nothing -- and it is exactly what would have
      #    surfaced (1) years ago instead of hiding it behind a green step.
      #
      # Context, 2026-09: no leg of this workflow is green on ANY platform. Census of
      # the job records: linux-x64 77 failure / 19 cancelled / 0 success, linux-arm64
      # 77/19/0, macos-arm64 75/25/0, windows-x64 61/35/0. The only two successes on
      # record are from 2026-07-06, under the pre-rename job names. The arm64 leg
      # fails earlier than x64, and x64 fails for an unrelated project-level reason
      # (`cannot open file: results`, codetracer_ct_print.nim(24, 8)). These
      # artifacts are the only way to find out why any of it actually fails.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .repro/build/*/build-failure-report.json
            .repro/build/*/build-engine-cache/actions/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Retain checkout template authority hashes
        if: always() && matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: adapters-checkout-template-authority-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/adapters-checkout-git-templates/*.tsv
            ${{ runner.temp }}/adapters-checkout-git-templates/git-image.txt
            ${{ runner.temp }}/adapters-checkout-git-templates/git-image.sha256
            ${{ runner.temp }}/adapters-checkout-git-templates/templates-source.txt
            ${{ runner.temp }}/adapters-checkout-git-templates/source-head.txt
            ${{ runner.temp }}/adapters-checkout-git-templates/result.txt
          if-no-files-found: warn
          retention-days: 7
